name: Zbieracz danych (OI i funding)

# Harmonogram wyłączony: test z 22.11.2026 pokazał, że Binance Futures odrzuca zapytania z serwerów GitHuba (HTTP 451).
# Zostaje tylko ręczne uruchomienie. Przywrócenie: odkomentować schedule.
on:
  # schedule:
  #   - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Zbierz dane i zapisz na gałęzi data
        run: bash collector/run.sh
