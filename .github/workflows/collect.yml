name: Zbieracz danych (OI i funding)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'collector/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Zbierz dane i zapisz na gałęzi data
        run: bash collector/run.sh
