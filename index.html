<script>
(() => {
'use strict';

// ===================== LOGIC-START =====================
// Czysta logika (bez przeglądarki): kierunek trendu, zmiany cen, status coina, ranking Top 3, formatowanie liczb.
const N_PIV = 3;            // pivot N, jak w terminalu
const OI_MIN = 0.1;         // OI musi wzrosnąć o więcej niż 0,1% w oknie, żeby uznać wzrost za potwierdzenie

  function findPivots(c, N) {
    const out = [];
    for (let i = N; i < c.length - N; i++) {
      let isH = true, isL = true;
      for (let k = 1; k <= N; k++) {
        if (!(c[i].high > c[i - k].high && c[i].high >= c[i + k].high)) isH = false;
        if (!(c[i].low < c[i - k].low && c[i].low <= c[i + k].low)) isL = false;
        if (!isH && !isL) break;
      }
      if (isH) out.push({ idx: i, type: 'H', price: c[i].high, confirm: i + N });
      if (isL) out.push({ idx: i, type: 'L', price: c[i].low, confirm: i + N });
    }
    // etykiety HH/LH/HL/LL względem poprzedniego pivota tego samego typu
    let pH = null, pL = null;
    out.sort((a, b) => a.idx - b.idx).forEach(p => {
      if (p.type === 'H') { p.label = pH == null ? 'H' : (p.price > pH ? 'HH' : 'LH'); pH = p.price; }
      else { p.label = pL == null ? 'L' : (p.price > pL ? 'HL' : 'LL'); pL = p.price; }
    });
    return out;
  }

  function analyze(c, N) {
    const pivots = findPivots(c, N);
    const byConfirm = new Map();
    pivots.forEach(p => { if (!byConfirm.has(p.confirm)) byConfirm.set(p.confirm, []); byConfirm.get(p.confirm).push(p); });
    let lastH = null, lastL = null, trend = 0;
    const events = [];
    for (let i = 0; i < c.length; i++) {
      (byConfirm.get(i) || []).forEach(p => {
        if (p.type === 'H') lastH = { idx: p.idx, price: p.price, broken: false };
        else lastL = { idx: p.idx, price: p.price, broken: false };
      });
      const cl = c[i].close;
      if (lastH && !lastH.broken && cl > lastH.price) {
        events.push({ idx: i, from: lastH.idx, price: lastH.price, dir: 1, kind: trend === -1 ? 'CHoCH' : 'BOS' });
        trend = 1; lastH.broken = true;
      } else if (lastL && !lastL.broken && cl < lastL.price) {
        events.push({ idx: i, from: lastL.idx, price: lastL.price, dir: -1, kind: trend === 1 ? 'CHoCH' : 'BOS' });
        trend = -1; lastL.broken = true;
      }
    }
    return { pivots, events, trend, lastH, lastL };
  }


const trendOf = c => (c && c.length >= 30) ? analyze(c, N_PIV).trend : 0;
const closedOnly = (c, now) => (c.length && c[c.length - 1].closeTime > now) ? c.slice(0, -1) : c;
// zamknięcie ostatniej świecy, która zamknęła się najpóźniej ms milisekund temu (cena sprzed okresu); null gdy historia za krótka
function refClose(c, now, ms) {
  const t = now - ms;
  for (let i = c.length - 1; i >= 0; i--) if (c[i].closeTime <= t) return c[i].close;
  return null;
}
const pct = (a, b) => (a != null && b != null && b > 0 && isFinite(a) && isFinite(b)) ? (a / b - 1) * 100 : null;

// OI w kontraktach (sumOpenInterest), nie w dolarach: wartość w dolarach zmienia się razem z ceną i zafałszowałaby pytanie "czy OI rośnie razem z ceną".
// h: próbki co 5 minut, rosnąco. 12 próbek = 1H, 48 próbek = 4H.
function oiChanges(h) {
  if (!Array.isArray(h) || h.length < 13) return { oi1h: null, oi4h: null };
  const v = h.map(x => +x.sumOpenInterest), last = v[v.length - 1];
  return { oi1h: pct(last, v[v.length - 13]), oi4h: v.length >= 49 ? pct(last, v[v.length - 49]) : null };
}

// Status: NO TRADE = kierunki 1D/4H/1H/15M nie są zgodne; TRIGGER = zgodne i OI rośnie razem z ceną na 1H i 4H
// (LONG: cena rośnie, OI rośnie; SHORT: cena spada, OI rośnie); WAIT = zgodne, ale OI nie potwierdza.
function classify(x) {
  const arr = [x.t.d1, x.t.h4, x.t.h1, x.t.m15];
  if (!(x.t.d1 !== 0 && arr.every(v => v === x.t.d1))) return { status: 'NO TRADE', dir: 0, aligned: false, conds: [] };
  const dir = x.t.d1;
  const mk = (label, p, oi) => {
    if (p == null || oi == null) return { label, na: true, ok: false, p, oi };
    const pOk = dir > 0 ? p > 0 : p < 0, oiOk = oi > OI_MIN;
    return { label, p, oi, pOk, oiOk, ok: pOk && oiOk };
  };
  const conds = [mk('1H', x.p1h, x.oi1h), mk('4H', x.p4h, x.oi4h)];
  return { status: conds[0].ok && conds[1].ok ? 'TRIGGER' : 'WAIT', dir, aligned: true, conds };
}

// Top 3: najpierw TRIGGER wg zmiany OI na 4H (malejąco), potem WAIT wg liczby spełnionych warunków i zmiany OI na 4H. Remis: wolumen 24h.
function rankTop(items, n = 3) {
  const okN = i => i.conds.filter(c => c.ok).length, oi4 = i => (i.oi4h == null ? -Infinity : i.oi4h);
  return items.filter(i => i.status !== 'NO TRADE').sort((a, b) => {
    const ta = a.status === 'TRIGGER' ? 1 : 0, tb = b.status === 'TRIGGER' ? 1 : 0;
    if (ta !== tb) return tb - ta;
    if (!ta && okN(a) !== okN(b)) return okN(b) - okN(a);
    if (oi4(a) !== oi4(b)) return oi4(b) - oi4(a);
    return (b.vol || 0) - (a.vol || 0);
  }).slice(0, n);
}

// formatowanie po polsku: spacja jako separator tysięcy, przecinek dziesiętny
function groupInt(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function fmtPrice(v) {
  if (v == null || !isFinite(v)) return '–';
  const a = Math.abs(v), d = a >= 10 ? 2 : a >= 1 ? 3 : a >= 0.1 ? 4 : a >= 0.01 ? 5 : 6;
  const [i, f] = Math.abs(v).toFixed(d).split('.');
  return (v < 0 ? '−' : '') + groupInt(i) + ',' + f;
}
function fmtPct(v) {
  if (v == null || !isFinite(v)) return '–';
  const d = Math.abs(v) < 0.1 && v !== 0 ? 2 : 1, s = Math.abs(v).toFixed(d).replace('.', ',');
  return (v > 0 ? '+' : v < 0 ? '−' : '') + s + '%';
}
const arrow = d => d > 0 ? '▲' : d < 0 ? '▼' : '–';
const cls = d => d > 0 ? 'up' : d < 0 ? 'down' : '';
// ===================== LOGIC-END =====================

// ---------- sieć ----------
const BASE = 'https://fapi.binance.com';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DUR = { '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400 };
async function getJSON(url, tries = 3) {
  for (let a = 0; a < tries; a++) {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
    try {
      const r = await fetch(url, { signal: ctl.signal }); clearTimeout(to);
      if (r.status === 429 || r.status === 418) { await sleep(1500 * (a + 1)); continue; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { clearTimeout(to); if (a === tries - 1) throw e; await sleep(500 * (a + 1)); }
  }
  throw new Error('limit zapytań giełdy');
}
const mapK = k => k.map(x => ({ time: Math.floor(x[0] / 1000), open: +x[1], high: +x[2], low: +x[3], close: +x[4], volume: +x[5], closeTime: x[6] }));
const S = { demo: false, coins: [], D: {}, filter: 'all', open: null, scanning: false, prog: 0, progTxt: '', ts: 0, err: '', note: '' };
try { const f = localStorage.getItem('busola_filter'); if (f === 'long' || f === 'short' || f === 'all') S.filter = f; } catch (e) { /* tylko w pamięci */ }

let demoNow = 0;
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
// dane DEMO: sztuczne (losowy spacer z dryfem zależnym od coina), tylko żeby zobaczyć wygląd
function demoKlines(sym, tf, limit) {
  const dur = DUR[tf] * 1000, now = demoNow, h = hashStr(sym), r = rng(h ^ hashStr(tf)), base = 0.5 + (h % 5000) / 5, drift = (((h >>> 8) % 200) - 100) / 100 * 0.0009, out = [];
  let p = base * (1 - drift * limit * 0.5), t0 = Math.floor(now / dur) * dur - (limit - 1) * dur;
  for (let i = 0; i < limit; i++) {
    const o = p; p = p * (1 + drift + (r() - 0.5) * 0.012); const hi = Math.max(o, p) * (1 + r() * 0.003), lo = Math.min(o, p) * (1 - r() * 0.003);
    out.push({ time: Math.floor((t0 + i * dur) / 1000), open: o, high: hi, low: lo, close: p, volume: 1000 + r() * 1000, closeTime: t0 + (i + 1) * dur - 1 });
  }
  return out;
}
const DEMO_SYMS = ['BTC', 'ETH', 'SOL', 'XRP', 'BNB', 'DOGE', 'ADA', 'AVAX', 'LINK', 'TRX', 'LTC', 'DOT', 'SUI', 'NEAR', 'APT', 'ARB', 'OP', 'INJ', 'ATOM', 'FIL', 'AAVE', 'UNI', 'TON', 'HBAR', 'ETC'];
async function klines(sym, tf, limit) { return S.demo ? demoKlines(sym, tf, limit) : mapK(await getJSON(`${BASE}/fapi/v1/klines?symbol=${sym}&interval=${tf}&limit=${limit}`)); }
async function oiHist(sym) {
  if (S.demo) { const r = rng(hashStr(sym + 'oi')), up = r() > 0.35; let v = 1e6; return Array.from({ length: 49 }, () => ({ sumOpenInterest: (v *= 1 + (up ? 0.0012 : -0.0004) + (r() - 0.5) * 0.001) })); }
  return getJSON(`${BASE}/futures/data/openInterestHist?symbol=${sym}&period=5m&limit=49`);
}

const TRADFI_RE = /^(SPY|QQQ|SQQQ|TQQQ|IWM|DIA|META|AMD|NVDA|TSLA|AAPL|MSFT|AMZN|GOOGL?|NFLX|COIN|MSTR|HOOD|PLTR|INTC|ORCL|BABA|XAU|XAG|XPT|XPD|CL|BZ|NATGAS|EURUSD|GBPUSD|USDJPY)USDT$/;
const STABLE_RE = /^(USDC|FDUSD|TUSD|BUSD|USDP|DAI|EUR|AEUR)USDT$/;
async function loadCoins() {
  if (S.demo) { demoNow = Date.now(); return DEMO_SYMS.map((s, i) => { const k = demoKlines(s + 'USDT', '1h', 300), z = k.slice(-25); return { sym: s + 'USDT', last: k[299].close, chg: (k[299].close / z[0].close - 1) * 100, vol: 1e9 / (i + 1), hi: Math.max(...z.map(x => x.high)), lo: Math.min(...z.map(x => x.low)) }; }); }
  const [t, ei] = await Promise.all([getJSON(`${BASE}/fapi/v1/ticker/24hr`), getJSON(`${BASE}/fapi/v1/exchangeInfo`).catch(() => null)]);
  const tf = new Set(); if (ei && ei.symbols) ei.symbols.forEach(x => { if (x.underlyingType && x.underlyingType !== 'COIN') tf.add(x.symbol); });
  return t.filter(x => x.symbol.endsWith('USDT') && !x.symbol.includes('_') && !STABLE_RE.test(x.symbol) && !tf.has(x.symbol) && !TRADFI_RE.test(x.symbol))

// ---------- obliczenia na coinie ----------
function seriesOf(c, n) { const s = c.slice(-n).map(x => x.close); return s; }
function chartData(d) {
  // wykres 24h: z 15M (96 świec) gdy są, inaczej z 1H (24 świece); markery na najniższym i najwyższym zamknięciu serii
  const c = d.c15 && d.c15.length >= 96 ? d.c15.slice(-96) : d.c1h ? d.c1h.slice(-24) : null;
  if (!c || c.length < 8) return null;
  const v = c.map(x => x.close); v[v.length - 1] = d.last;
  const lo = Math.min(...v), hi = Math.max(...v), span = (hi - lo) || 1, n = v.length;
  const xy = v.map((x, i) => [i / (n - 1) * 322, 100 - (x - lo) / span * 90]);
  let iMin = 0, iMax = 0; v.forEach((x, i) => { if (x < v[iMin]) iMin = i; if (x > v[iMax]) iMax = i; });
  return { xy, iMin, iMax, low: Math.min(...c.map(x => x.low)), high: Math.max(...c.map(x => x.high)) };
}
function applyChanges(d, now) {
  const r1 = d.c15 ? refClose(d.c15, now, 3600e3) : (d.c1h ? refClose(d.c1h, now, 3600e3) : null);
  d.ch = { h1: pct(d.last, r1), d1: d.chg24, w1: pct(d.last, refClose(d.cd, now, 7 * 86400e3)), m1: pct(d.last, refClose(d.cd, now, 30 * 86400e3)), y1: pct(d.last, refClose(d.cd, now, 365 * 86400e3)) };
  d.p1h = d.c15 ? pct(d.last, refClose(d.c15, now, 3600e3)) : null;
  d.p4h = d.c15 ? pct(d.last, refClose(d.c15, now, 4 * 3600e3)) : null;
}
function finalize(d) {
  const r = classify({ t: d.t, p1h: d.p1h, p4h: d.p4h, oi1h: d.oi1h, oi4h: d.oi4h });
  Object.assign(d, { status: r.status, dir: r.dir, aligned: r.aligned, conds: r.conds });
}

async function stage1(c, now) {
  const [kd, k4, k1] = await Promise.all([klines(c.sym, '1d', 400), klines(c.sym, '4h', 300), klines(c.sym, '1h', 300)]);
  const d = { sym: c.sym, last: c.last, chg24: c.chg, vol: c.vol, hi24: c.hi, lo24: c.lo, cd: kd, c1h: k1, t: { d1: trendOf(closedOnly(kd, now)), h4: trendOf(closedOnly(k4, now)), h1: trendOf(closedOnly(k1, now)), m15: 0 }, spark: seriesOf(k1, 24).concat([c.last]) };
  d.pending = d.t.d1 !== 0 && d.t.d1 === d.t.h4 && d.t.d1 === d.t.h1;
  applyChanges(d, now); d.status = 'NO TRADE'; d.dir = 0; d.aligned = false; d.conds = [];
  return d;
}
async function stage2(d, now) {
  const [k15, oi] = await Promise.all([klines(d.sym, '15m', 300), oiHist(d.sym).then(h => oiChanges(h)).catch(() => ({ oi1h: null, oi4h: null, fail: true }))]);
  d.c15 = k15; d.t.m15 = trendOf(closedOnly(k15, now)); d.oi1h = oi.oi1h; d.oi4h = oi.oi4h; d.oiFail = !!oi.fail; d.pending = false;
  applyChanges(d, now); finalize(d);
}
async function lazy15(d) {   // po rozwinięciu coina, który nie przeszedł do 2. etapu: tylko świece 15M do wykresu i zmiany 1H
  if (d.c15 || d.loading) return; d.loading = true; render();
  try { const now = Date.now(); d.c15 = await klines(d.sym, '15m', 300); d.t.m15 = trendOf(closedOnly(d.c15, now)); applyChanges(d, now); } catch (e) { d.loadErr = true; }
  d.loading = false; render();
}
async function pool(items, n, fn) { let i = 0; await Promise.all(Array.from({ length: n }, async () => { while (i < items.length) { const it = items[i++]; await fn(it); } })); }

async function scan() {
  if (S.scanning) return;
  S.scanning = true; S.err = ''; S.prog = 0; S.progTxt = 'Pobieram listę coinów…'; render();
  try {
    S.coins = await loadCoins();
    if (!S.coins.length) throw new Error('pusta lista coinów');
    const now = Date.now(), D = {}; let n = 0;
    S.progTxt = `Pobieram dane 0/${S.coins.length}`; setProg(0);
    await pool(S.coins, 4, async c => {
      try { D[c.sym] = await stage1(c, now); } catch (e) { /* coin pomijamy */ }
      n++; setProg(n / S.coins.length * 0.7, `Pobieram dane ${n}/${S.coins.length}`);
    });
    if (!Object.keys(D).length) throw new Error('nie udało się pobrać żadnych świec');
    S.D = D; S.ts = now; render();
    const cands = Object.values(D).filter(d => d.pending); let m = 0;
    await pool(cands, 4, async d => {
      try { await stage2(d, now); } catch (e) { d.pending = false; d.stageErr = true; }
      m++; setProg(0.7 + m / Math.max(1, cands.length) * 0.3, `Sprawdzam OI i 15M ${m}/${cands.length}`);
    });
  } catch (e) { S.err = (e && e.message) || 'błąd połączenia'; }
  S.scanning = false; S.prog = 1; render();
}
