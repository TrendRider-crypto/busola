<body>
<div class="app" id="app"></div>
<noscript><p style="padding:24px">Busola wymaga włączonego JavaScriptu.</p></noscript>
<script>
(() => {
'use strict';

// ===================== LOGIC-START =====================
// Czysta logika (bez przeglądarki): kierunek trendu, zmiany cen, status coina, ranking Top 3, formatowanie liczb.
const N_PIV = 3;            // pivot N, jak w terminalu
const OI_MIN = 0.1;         // OI musi wzrosnąć o więcej niż 0,1% w oknie, żeby uznać wzrost za potwierdzenie

  function findPivots(c, N) {
    const out = [];
    for (let i = N; i < c.length - N; i++) {
      let isH = true, isL = true;
      for (let k = 1; k <= N; k++) {
        if (!(c[i].high > c[i - k].high && c[i].high >= c[i + k].high)) isH = false;
        if (!(c[i].low < c[i - k].low && c[i].low <= c[i + k].low)) isL = false;
        if (!isH && !isL) break;
      }
      if (isH) out.push({ idx: i, type: 'H', price: c[i].high, confirm: i + N });
      if (isL) out.push({ idx: i, type: 'L', price: c[i].low, confirm: i + N });
    }
    // etykiety HH/LH/HL/LL względem poprzedniego pivota tego samego typu
    let pH = null, pL = null;
    out.sort((a, b) => a.idx - b.idx).forEach(p => {
      if (p.type === 'H') { p.label = pH == null ? 'H' : (p.price > pH ? 'HH' : 'LH'); pH = p.price; }
      else { p.label = pL == null ? 'L' : (p.price > pL ? 'HL' : 'LL'); pL = p.price; }
    });
    return out;
  }

  function analyze(c, N) {
    const pivots = findPivots(c, N);
    const byConfirm = new Map();
    pivots.forEach(p => { if (!byConfirm.has(p.confirm)) byConfirm.set(p.confirm, []); byConfirm.get(p.confirm).push(p); });
    let lastH = null, lastL = null, trend = 0;
    const events = [];
    for (let i = 0; i < c.length; i++) {
      (byConfirm.get(i) || []).forEach(p => {
        if (p.type === 'H') lastH = { idx: p.idx, price: p.price, broken: false };
        else lastL = { idx: p.idx, price: p.price, broken: false };
      });
      const cl = c[i].close;
      if (lastH && !lastH.broken && cl > lastH.price) {
        events.push({ idx: i, from: lastH.idx, price: lastH.price, dir: 1, kind: trend === -1 ? 'CHoCH' : 'BOS' });
        trend = 1; lastH.broken = true;
      } else if (lastL && !lastL.broken && cl < lastL.price) {
        events.push({ idx: i, from: lastL.idx, price: lastL.price, dir: -1, kind: trend === 1 ? 'CHoCH' : 'BOS' });
        trend = -1; lastL.broken = true;
      }
    }
    return { pivots, events, trend, lastH, lastL };
  }

  // ATR: średnia krocząca True Range (okno len).
  function atrArr(c, len = 14) {
    const out = [], tr = []; let sum = 0;
    for (let i = 0; i < c.length; i++) {
      const pc = i ? c[i - 1].close : c[i].open;
      const t = Math.max(c[i].high - c[i].low, Math.abs(c[i].high - pc), Math.abs(c[i].low - pc));
      tr.push(t); sum += t; if (i >= len) sum -= tr[i - len];
      out.push(sum / Math.min(i + 1, len));
    }
    return out;
  }

  // Strefy:
  //  OB (order block) = ostatnia świeca przeciwna do ruchu tuż przed impulsem, który złamał strukturę
  //     (popyt: ostatnia spadkowa przed impulsem w górę; podaż: ostatnia wzrostowa przed impulsem w dół).
  //     Wymagane przemieszczenie: impuls >= 1 ATR.
  //  FVG = luka między świecą 1 a 3 (>= 0,3 ATR).
  //  Mitygacja: strefa popytu wygasa po ZAMKNIĘCIU poniżej dołu strefy (podaży: powyżej góry).
  function zones(c, N) {
    const atr = atrArr(c), a = analyze(c, N), out = [], seen = new Set();
    const finish = (z, from) => {
      z.t1 = null; z.tested = false;
      for (let k = from; k < c.length; k++) {
        if (z.dir === 1) { if (c[k].low <= z.top) z.tested = true; if (c[k].close < z.bottom) { z.t1 = c[k].time; break; } }
        else { if (c[k].high >= z.bottom) z.tested = true; if (c[k].close > z.top) { z.t1 = c[k].time; break; } }
      }
      return z;
    };
    a.events.forEach(e => {
      let m = e.from, j = -1;
      if (e.dir === 1) {
        for (let k = e.from; k <= e.idx; k++) if (c[k].low < c[m].low) m = k;
        if (c[e.idx].close - c[m].low < atr[e.idx]) return;
        for (let k = m; k >= Math.max(0, m - 6); k--) if (c[k].close < c[k].open) { j = k; break; }
      } else {
        for (let k = e.from; k <= e.idx; k++) if (c[k].high > c[m].high) m = k;
        if (c[m].high - c[e.idx].close < atr[e.idx]) return;
        for (let k = m; k >= Math.max(0, m - 6); k--) if (c[k].close > c[k].open) { j = k; break; }
      }
      if (j < 0) return;
      const key = 'O' + j + e.dir; if (seen.has(key)) return; seen.add(key);
      out.push(finish({ kind: 'OB', dir: e.dir, top: c[j].high, bottom: c[j].low, idx: j, formed: e.idx, t0: c[j].time, via: e.kind }, e.idx + 1));
    });
    for (let k = 1; k < c.length - 1; k++) {
      const p = c[k - 1], n = c[k + 1], th = 0.3 * atr[k];
      if (n.low - p.high >= th && n.low > p.high)
        out.push(finish({ kind: 'FVG', dir: 1, top: n.low, bottom: p.high, idx: k - 1, formed: k + 1, t0: p.time }, k + 2));
      else if (p.low - n.high >= th && p.low > n.high)
        out.push(finish({ kind: 'FVG', dir: -1, top: p.low, bottom: n.high, idx: k - 1, formed: k + 1, t0: p.time }, k + 2));
    }
    return out.sort((x, y) => x.idx - y.idx);
  }


const trendOf = c => (c && c.length >= 30) ? analyze(c, N_PIV).trend : 0;
const closedOnly = (c, now) => (c.length && c[c.length - 1].closeTime > now) ? c.slice(0, -1) : c;
// zamknięcie ostatniej świecy, która zamknęła się najpóźniej ms milisekund temu (cena sprzed okresu); null gdy historia za krótka
function refClose(c, now, ms) {
  const t = now - ms;
  for (let i = c.length - 1; i >= 0; i--) if (c[i].closeTime <= t) return c[i].close;
  return null;
}
const pct = (a, b) => (a != null && b != null && b > 0 && isFinite(a) && isFinite(b)) ? (a / b - 1) * 100 : null;

// OI w kontraktach (sumOpenInterest), nie w dolarach: wartość w dolarach zmienia się razem z ceną i zafałszowałaby pytanie "czy OI rośnie razem z ceną".
// h: próbki co 5 minut, rosnąco. 12 próbek = 1H, 48 próbek = 4H.
function oiChanges(h) {
  if (!Array.isArray(h) || h.length < 13) return { oi1h: null, oi4h: null };
  const v = h.map(x => +x.sumOpenInterest), last = v[v.length - 1];
  return { oi1h: pct(last, v[v.length - 13]), oi4h: v.length >= 49 ? pct(last, v[v.length - 49]) : null };
}

// Status: NO TRADE = kierunki 1D/4H/1H/15M nie są zgodne; TRIGGER = zgodne i OI rośnie razem z ceną na 1H i 4H
// (LONG: cena rośnie, OI rośnie; SHORT: cena spada, OI rośnie); WAIT = zgodne, ale OI nie potwierdza.
function classify(x) {
  const arr = [x.t.d1, x.t.h4, x.t.h1, x.t.m15];
  if (!(x.t.d1 !== 0 && arr.every(v => v === x.t.d1))) return { status: 'NO TRADE', dir: 0, aligned: false, conds: [] };
  const dir = x.t.d1;
  const mk = (label, p, oi) => {
    if (p == null || oi == null) return { label, na: true, ok: false, p, oi };
    const pOk = dir > 0 ? p > 0 : p < 0, oiOk = oi > OI_MIN;
    return { label, p, oi, pOk, oiOk, ok: pOk && oiOk };
  };
  const conds = [mk('1H', x.p1h, x.oi1h), mk('4H', x.p4h, x.oi4h)];
  return { status: conds[0].ok && conds[1].ok ? 'TRIGGER' : 'WAIT', dir, aligned: true, conds };
}

// Top 3: najpierw TRIGGER wg zmiany OI na 4H (malejąco), potem WAIT wg liczby spełnionych warunków i zmiany OI na 4H. Remis: wolumen 24h.
function rankTop(items, n = 3) {
  const okN = i => i.conds.filter(c => c.ok).length, oi4 = i => (i.oi4h == null ? -Infinity : i.oi4h);
  return items.filter(i => i.status !== 'NO TRADE').sort((a, b) => {
    const ta = a.status === 'TRIGGER' ? 1 : 0, tb = b.status === 'TRIGGER' ? 1 : 0;
    if (ta !== tb) return tb - ta;
    if (!ta && okN(a) !== okN(b)) return okN(b) - okN(a);
    if (oi4(a) !== oi4(b)) return oi4(b) - oi4(a);
    return (b.vol || 0) - (a.vol || 0);
  }).slice(0, n);
}

// ---------- strefy OB / FVG (1H i 4H) i reakcja ceny na OB ----------
// Silnik stref jak w terminalu (zones): OB z knotami (cały zakres świecy), FVG >= 0,3 ATR. Strefa jest ważna do ZAMKNIĘCIA świecy za jej drugą stroną
// (popyt: poniżej dołu, podaż: powyżej góry); dotknięcie bez zamknięcia = "testowana". To informacja, nie sygnał: nie zmienia statusu i nie ma udowodnionej przewagi.
// Dotknięcia strefy po jej powstaniu: kolejne świece, które weszły w strefę, liczą się jako jedno dotknięcie. lastTouch = koniec ostatniej takiej świecy (ms).
function touchStats(c, z) {
  let touches = 0, lastTouch = null, prev = false;
  for (let k = z.formed + 1; k < c.length; k++) {
    const hit = z.dir > 0 ? c[k].low <= z.top : c[k].high >= z.bottom;
    if (hit) { if (!prev) touches++; lastTouch = c[k].closeTime; }
    prev = hit;
  }
  return { touches, lastTouch };
}
const plTouch = n => n === 1 ? 'dotknięcie' : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? 'dotknięcia' : 'dotknięć';
function agoTxt(ms, now) {
  const h = (now - ms) / 3600e3;
  return h < 1 ? '<1 godz. temu' : h < 48 ? Math.round(h) + ' godz. temu' : Math.round(h / 24) + ' dni temu';
}
const ZN_MAX = 2;                         // najbliższe strefy po każdej stronie ceny
const RX_WIN = { '4H': 24, '1H': 16 };    // "świeże" dotknięcie: ostatnie 24 świece 1H (strefa 4H) albo 16 świec 15M (strefa 1H)
function zonesOf(c1h, c4h, price, now) {
  if (!(price > 0)) return null;
  const all = [];
  for (const [tf, c] of [['1H', c1h], ['4H', c4h]]) {
    if (!c || c.length < 40) continue;
    const cc = closedOnly(c, now);
    for (const z of zones(cc, N_PIV)) if (z.t1 === null) all.push({ kind: z.kind, tf, dir: z.dir, top: z.top, bottom: z.bottom, tested: z.tested, ...touchStats(cc, z) });
  }
  const above = [], below = [], inside = [];
  for (const z of all) {
    if (z.bottom > price) above.push({ ...z, dist: (z.bottom / price - 1) * 100 });
    else if (z.top < price) below.push({ ...z, dist: (z.top / price - 1) * 100 });
    else inside.push({ ...z, dist: 0 });
  }
  const near = (a, b) => Math.abs(a.dist) - Math.abs(b.dist);
  return { above: above.sort(near).slice(0, ZN_MAX), below: below.sort(near).slice(0, ZN_MAX), inside: inside.slice(0, ZN_MAX), total: all.length };
}
// Reakcja na OB (tylko coiny ze zgodnym kierunkiem): strefa 4H -> potwierdzenie na 1H, strefa 1H -> potwierdzenie na 15M.
// Świeże dotknięcie niewypełnionego OB, a potem pierwsze złamanie struktury na niższym interwale w kierunku odbicia (od popytu w górę, od podaży w dół).
// Zgodne z kierunkiem coina = potwierdzenie (ok), przeciwne = ostrzeżenie o możliwej zmianie trendu (CHoCH przeciw).
function reactionsOf(d, now) {
  if (!d.dir || !d.c15 || !d.c1h || !d.c4h) return [];
  const best = {};
  for (const [tf, cz, cf, ctf] of [['4H', d.c4h, d.c1h, '1H'], ['1H', d.c1h, d.c15, '15M']]) {
    const zc = closedOnly(cz, now), fc = closedOnly(cf, now);
    if (zc.length < 40 || fc.length < 60) continue;
    const evs = analyze(fc, N_PIV).events;
    for (const z of zones(zc, N_PIV)) {
      if (z.kind !== 'OB' || z.t1 !== null) continue;
      const formedAt = zc[z.formed].closeTime; let kt = -1;
      for (let k = fc.length - 1; k >= 0 && fc[k].closeTime > formedAt; k--) if (z.dir > 0 ? fc[k].low <= z.top : fc[k].high >= z.bottom) { kt = k; break; }
      if (kt < 0 || fc.length - 1 - kt > RX_WIN[tf]) continue;
      const ev = evs.find(e => e.idx > kt && e.dir === z.dir);
      if (!ev) continue;
      if (!best[tf] || ev.idx > best[tf].evIdx) best[tf] = { tf, ctf, zoneDir: z.dir, evDir: ev.dir, kind: ev.kind, ok: ev.dir === d.dir, top: z.top, bottom: z.bottom, evIdx: ev.idx };
    }
  }
  return ['4H', '1H'].filter(k => best[k]).map(k => best[k]);
}
// Pullback (cofnięcie w trendzie): cztery interwały zgodne, a ostatnia godzina (lub 4 godziny) idzie przeciw kierunkowi. Tylko informacja.
function pullbackOf(d) {
  if (!d || !d.aligned || !d.conds || d.conds.length < 2) return null;
  const ag = c => c && !c.na && c.pOk === false;
  const tf = ag(d.conds[1]) ? '4H' : ag(d.conds[0]) ? '1H' : null;
  if (!tf) return null;
  // cena stoi w strefie po stronie kierunku (LONG: popyt, SHORT: podaż); OB ważniejszy od FVG, 4H ważniejszy od 1H
  const ins = ((d.zn && d.zn.inside) || []).filter(z => z.dir === d.dir).sort((a, b) => (a.kind === 'OB' ? 0 : 1) - (b.kind === 'OB' ? 0 : 1) || (a.tf === '4H' ? 0 : 1) - (b.tf === '4H' ? 0 : 1));
  return { tf, zone: ins[0] || null };
}
function rxFlag(rx) { return !rx || !rx.length ? null : rx.some(r => !r.ok) ? 'warn' : 'ok'; }

// ---------- sentyment rynku, Strach i Chciwość, płynność ----------
// Sentyment Busoli: średnia suma trendów struktury 1D + 4H + 1H po wszystkich coinach (skala -3...+3). To szerokość rynku w skanowanych coinach, nie prognoza.
// 15M nie wchodzi, bo jest sprawdzane tylko dla kandydatów.
const MOOD_LIM = [-1.8, -0.6, 0.6, 1.8];
const MOOD_LAB = ['bardzo niedźwiedzi', 'niedźwiedzi', 'neutralny', 'byczy', 'bardzo byczy'];
function moodOf(list) {
  let sum = 0, n = 0;
  for (const d of list || []) {
    if (!d || !d.t) continue;
    const v = [d.t.d1, d.t.h4, d.t.h1];
    if (v.some(x => typeof x !== 'number')) continue;
    sum += v[0] + v[1] + v[2]; n++;
  }
  if (n < 10) return null;
  const score = sum / n, i = MOOD_LIM.findIndex(l => score < l), band = i < 0 ? 4 : i;
  return { score, n, band, label: MOOD_LAB[band] };
}
// Indeks Crypto Fear & Greed (alternative.me), 0-100
const FG_LAB = ['skrajny strach', 'strach', 'neutralnie', 'chciwość', 'skrajna chciwość'];
const fgBand = v => v <= 24 ? 0 : v <= 44 ? 1 : v <= 55 ? 2 : v <= 75 ? 3 : 4;
// Płynność ze struktury: niezdjęte (żadna zamknięta świeca nie przebiła ich knotem) szczyty pivotów nad ceną = stopy shortów, niezdjęte dołki pod ceną = stopy longów.
// To szacunek ze struktury, nie realne zlecenia ani mapa likwidacji. Równe szczyty/dołki: kilka poziomów w odległości 0,15 ATR.
// "Zbieranie płynności": trwająca (niezamknięta) świeca albo cena już weszła ponad szczyt / pod dołek, którego nie zdjęła żadna zamknięta świeca.
// "Blisko": do poziomu zostało nie więcej niż 0,25 ATR.
function liquidityOf(c, price, now) {
  if (!c || !(price > 0)) return null;
  const closed = closedOnly(c, now);
  if (closed.length < 40) return null;
  const forming = c.length > closed.length ? c[c.length - 1] : null;
  const hiNow = forming ? Math.max(forming.high, price) : price, loNow = forming ? Math.min(forming.low, price) : price;
  const a = analyze(closed, N_PIV), atr = atrArr(closed)[closed.length - 1], tol = 0.15 * atr;
  const unswept = p => { for (let k = p.idx + 1; k < closed.length; k++) if (p.type === 'H' ? closed[k].high > p.price : closed[k].low < p.price) return false; return true; };
  const hs = a.pivots.filter(p => p.type === 'H' && unswept(p)).map(p => p.price), ls = a.pivots.filter(p => p.type === 'L' && unswept(p)).map(p => p.price);
  const sweeps = [];
  const sh = hs.filter(v => v <= hiNow); if (sh.length) sweeps.push({ side: 'H', price: Math.max(...sh) });
  const sl = ls.filter(v => v >= loNow); if (sl.length) sweeps.push({ side: 'L', price: Math.min(...sl) });
  const ah = hs.filter(v => v > hiNow).sort((x, y) => x - y), bl = ls.filter(v => v < loNow).sort((x, y) => y - x);
  const mk = (arr, sgn) => arr.length ? { price: arr[0], dist: (arr[0] / price - 1) * 100, n: arr.filter(v => Math.abs(v - arr[0]) <= tol).length, equal: arr.filter(v => Math.abs(v - arr[0]) <= tol).length >= 2, near: sgn * (arr[0] - price) <= 0.25 * atr } : null;
  return { above: mk(ah, 1), below: mk(bl, -1), sweeps };
}

  h += br.oiN ? `<div class="mp-br"><div><div class="mp-n up">${br.oiUp}</div><div class="mp-t">OI rośnie (4 godz.)</div></div><div style="text-align:right"><div class="mp-n down">${br.oiDown}</div><div class="mp-t">OI spada (4 godz.)</div></div></div>${tot ? `<div class="mp-bar"><i style="width:${(br.oiUp / tot * 100).toFixed(1)}%;background:var(--up)"></i><i style="width:${(br.oiDown / tot * 100).toFixed(1)}%;background:var(--down)"></i></div>` : ''}` : `<div class="mp-t" style="margin-top:8px">${S.mapOiBusy ? 'Pobieram OI…' : 'Brak danych OI (giełda nie odpowiedziała)'}</div>`;
  const oiNote = S.mapOiBusy ? `OI ${S.mapOiN}/${S.mapOiTot}` : br.oiN < items.length ? `OI dla ${br.oiN} z ${items.length}` : '';
  h += `<div class="mp-chips">${btc && btc.chg != null ? `<span class="mp-chip">BTC <span class="${cls(btc.chg)}">${fmtPct(btc.chg)}</span></span>` : ''}<span class="mp-chip">Ceny: ${br.pUp} w górę / ${br.pDown} w dół</span>${oiNote ? `<span class="mp-chip g">${oiNote}</span>` : ''}</div></div>`;
  const chart = mapChartHtml(items, S.mapF, S.mapTrim);
  if (chart) h += `<div class="mp-sec">Ścieżki ${mode === 'day' ? 'od początku dnia' : 'z 24 godzin'}</div><div class="mp-card mp-chart"><div class="mp-ctl"><button class="mp-btn" id="mpPlay" aria-label="Odtwórz dzień">${mapBtnHtml()}</button><button class="mp-btn${S.mapTrim ? ' on' : ''}" id="mpTrim" aria-pressed="${S.mapTrim}">Bez skrajnych</button></div><div id="mpPlot">${chart}</div><input class="mp-range" id="mpRange" type="range" min="0" max="1000" value="${Math.round(S.mapF * 1000)}" aria-label="Moment dnia"><div class="mp-sub">Każda linia to jeden coin (zmiana ceny w %). Zielone: powyżej poziomu startu, czerwone: poniżej. Podpisane są trzy najsilniejsze i trzy najsłabsze w danym momencie. ${S.mapTrim ? 'Oś ucięta do środkowych 98% punktów, skrajne linie wychodzą poza ramkę (ich wynik jest przy podpisie).' : ''}</div></div>`;
  const sec = mapSectors(items);
  if (sec.length) {
    const m = Math.max(0.5, ...sec.map(s => Math.abs(s.avg)));
    h += `<div class="mp-sec">Sektory · średnia zmiana</div><div class="mp-rows">${sec.map(s => { const pos = s.avg >= 0, w = Math.min(Math.abs(s.avg) / m, 1) * 50; return `<div class="mp-srow"><div class="mp-nm">${esc(s.name)}<small>${s.n} coinów · ${s.up}↑ ${s.down}↓</small></div><div class="mp-dv"><i style="${pos ? 'left' : 'right'}:50%;width:${w.toFixed(1)}%;background:var(${pos ? '--up' : '--down'})"></i></div><div class="mp-pc ${pos ? 'up' : 'down'}">${fmtPct(s.avg)}</div></div>`; }).join('')}</div>`;
  }
  const tile = x => {
    const up = x.chg >= 0, tag = x.label ? `<span class="mp-tag ${x.label}">${MAP_LAB[x.label]}</span>` : `<span class="mp-tag na">${S.mapOiBusy ? 'Pobieram OI…' : 'Brak danych OI'}</span>`;
    return `<a class="mp-tile ${up ? 'u' : 'd'}" href="https://www.tradingview.com/chart/?symbol=BINANCE:${encodeURIComponent(x.sym)}.P" target="_blank" rel="noopener"><div class="mp-h"><span class="mp-tk">${esc(base(x.sym))}</span><span class="mp-p ${up ? 'up' : 'down'}">${fmtPct(x.chg)}</span></div>${tag}<div class="mp-o">Cena 4 godz. ${fmtPct(x.p4)}<br>OI 4 godz. ${x.oi4 == null ? '–' : fmtPct(x.oi4)}</div>${sparkSvg(x.path.pts, 100, 26, 'mp-sp ' + (up ? 'up' : 'down'), 1.6)}</a>`;
  };
  const rk = mapRank(wp, 4);
  h += `<div class="mp-sec">Najsilniejsze</div><div class="mp-grid2">${rk.top.length ? rk.top.map(tile).join('') : '<div class="empty" style="grid-column:1/-1">Żaden coin nie jest teraz na plusie.</div>'}</div>`;
  h += `<div class="mp-sec">Najsłabsze</div><div class="mp-grid2">${rk.bottom.length ? rk.bottom.map(tile).join('') : '<div class="empty" style="grid-column:1/-1">Żaden coin nie jest teraz na minusie.</div>'}</div>`;
  h += `<div class="mp-sec">Jak czytać etykiety</div><div class="mp-quad"><div class="mp-q"><b class="up">Nowe longi</b>cena rośnie, OI rośnie</div><div class="mp-q"><b class="down">Nowe shorty</b>cena spada, OI rośnie</div><div class="mp-q"><b style="color:var(--gold)">Zamykanie shortów</b>cena rośnie, OI spada</div><div class="mp-q"><b style="color:var(--warn)">Zamykanie longów</b>cena spada, OI spada</div></div>`;
  h += `<p class="fine">Mapa opisuje, co dzieje się teraz. To nie jest sygnał i nie ma udowodnionej przewagi. Zmiana na wykresie i w kafelkach liczona jest od ${mode === 'day' ? 'północy UTC' : 'ostatnich 24 godzin'} z zamkniętych świec 1H i bieżącej ceny. Etykieta bierze znak zmiany ceny i OI (w kontraktach) z ostatnich 4 godzin; gdy cena zmieniła się o nie więcej niż ${String(MAP_P_MIN).replace('.', ',')}% albo OI o nie więcej niż ${String(OI_MIN).replace('.', ',')}%, jest "Bez wyraźnego ruchu". Przypisanie do sektorów jest ręczne i przybliżone. Mapa obejmuje te same 100 coinów o największym wolumenie co skaner. Etykiety nie są (jeszcze) zapisywane w Dzienniku.</p>`;
  return h;
}
function render() {
  if (S.view === 'map') { const sy0 = window.scrollY; $app.innerHTML = mapHtml(); window.scrollTo(0, sy0); return; }
  if (S.view === 'journal') { const sy0 = window.scrollY; $app.innerHTML = journalHtml(); window.scrollTo(0, sy0); return; }
  const car = $app.querySelector('.car'), sl = car ? car.scrollLeft : 0, sy = window.scrollY;
  const vis = visibleCoins(), have = Object.keys(S.D).length > 0;
  const settled = vis.filter(d => !d.pending);
  const top = rankTop(settled), topSyms = new Set(top.map(d => d.sym));
  const rest = vis.filter(d => !topSyms.has(d.sym)).sort((a, b) => {
    const o = d => d.pending ? 1 : d.status === 'NO TRADE' ? 3 : d.status === 'TRIGGER' ? 0 : 2;
    return o(a) - o(b) || b.vol - a.vol;
  });
  const dark = document.documentElement.classList.contains('dark');
  let h = `<header class="hdr"><div class="brand">${LOGO}<span>Busola</span></div><div class="hbtns">
    <button class="ibtn" id="btnMap" aria-label="Mapa rynku">${svgI(ICO.map, 20, 1.8)}</button>
    <button class="ibtn" id="btnJr" aria-label="Dziennik wyników">${svgI(ICO.journal, 20, 1.8)}</button>
    <button class="ibtn" id="btnTheme" aria-label="${dark ? 'Przełącz na jasny motyw' : 'Przełącz na ciemny motyw'}">${svgI(dark ? ICO.sun : ICO.moon, 20, 1.8)}</button>
    <button class="ibtn${S.scanning ? ' spin' : ''}" id="btnScan" aria-label="Odśwież skan"${S.scanning ? ' disabled' : ''}>${svgI(ICO.refresh, 20, 1.8)}</button></div></header>`;
  const when = S.ts ? new Date(S.ts).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }) : '';
  h += `<div class="meta"><span class="dot${S.scanning ? ' busy' : S.err ? ' err' : ''}"></span><span id="metaTxt">${S.scanning ? esc(S.progTxt) : S.err ? 'Błąd skanu' : when ? `Ostatni skan ${when} · ${Object.keys(S.D).length} coinów · ${S.demo ? 'DEMO' : 'Binance Futures'}` : 'Gotowy'}</span></div>`;
  h += S.scanning ? `<div class="bar"><i style="width:${Math.round(S.prog * 100)}%"></i></div>` : '';
  if (S.err) h += `<div class="banner"><span>Nie udało się pobrać danych z Binance (${esc(S.err)}). Sprawdź połączenie albo zobacz wygląd na danych demo.</span><button id="btnDemo">Dane demo</button></div>`;
  else if (S.demo) h += `<div class="banner demo"><span>Dane DEMO: sztuczne, tylko do oglądania wyglądu. To nie są prawdziwe ceny.</span><button id="btnLive">Dane live</button></div>`;
  h += moodHtml();
  h += `<div class="seg" role="group" aria-label="Filtr kierunku">${[['all', 'Wszystkie'], ['long', 'LONG'], ['short', 'SHORT']].map(([k, l]) => `<button class="segb${S.filter === k ? ' on' : ''}" data-f="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}</div>`;
  if (!have && S.scanning) h += `<div class="sect"><h2>Skanuję rynek</h2><span></span></div><div class="empty">Pobieram świece 1D, 4H i 1H dla 100 coinów, a potem OI. To trwa kilkanaście sekund.</div>`;
  else if (have) {
    h += `<div class="sect"><h2>Top 3</h2><span>najmocniejsze potwierdzenie OI</span></div>`;
    if (top.length) {
      h += `<div class="car">${top.map(topCardHtml).join('')}</div>`;
      const od = top.find(d => d.sym === S.open); if (od) h += `<div class="dcard">${detailInner(od)}</div>`;
    } else h += `<div class="empty">${S.scanning ? 'Sprawdzam kandydatów…' : 'Żaden coin nie ma teraz zgodnych kierunków na 1D, 4H, 1H i 15M' + (S.filter !== 'all' ? ' w tym kierunku.' : '.')}</div>`;
    h += `<div class="sect"><h2>Pozostałe coiny</h2><span>${rest.length}</span></div>`;
    h += rest.length ? `<div class="list">${rest.map(rowHtml).join('')}</div>` : '<div class="empty">Brak coinów do pokazania przy tym filtrze.</div>';
    h += `<p class="fine">TRIGGER = 1D, 4H, 1H i 15M w tym samym kierunku oraz OI (w kontraktach) rośnie o więcej niż ${OI_MIN}% razem z ceną (LONG) albo przy spadającej cenie (SHORT) na 1H i 4H. WAIT = kierunki zgodne, OI jeszcze nie potwierdza. To filtr, nie prognoza ani sygnał z udowodnioną przewagą. Strefy OB i FVG (1H i 4H, niewypełnione, z knotami, ważne do zamknięcia świecy za strefą) oraz znacznik reakcji (OB ✓ / CHoCH ⚠) to tylko informacja: nie zmieniają statusu i też nie mają udowodnionej przewagi. Sentyment to średni trend struktury (1D, 4H, 1H) wszystkich skanowanych coinów, a Strach i Chciwość to indeks z alternative.me; oba tylko opisują rynek. Płynność to szacunek ze struktury (niezdjęte szczyty i dołki), nie realne zlecenia. Znacznik Pullback oznacza cofnięcie w trendzie (kierunek zgodny, a ostatnia godzina lub 4 godziny idą przeciw) i też jest tylko informacją. Mapa (ikona kafelków u góry) pokazuje ścieżki cen od północy UTC, sektory oraz etykiety cena × OI dla 100 coinów; to tylko opis. Dziennik (ikona wykresu u góry) zapisuje w tej przeglądarce sygnały ze zgodnymi czterema interwałami i rozlicza je po 1, 4 i 24 godzinach; wnioski pokazuje dopiero po spełnieniu progów ustalonych z góry. Kierunek trendu liczony ze struktury szczytów i dołków (pivot ${N_PIV}) na zamkniętych świecach.</p>`;
  }
  $app.innerHTML = h;
  const c2 = $app.querySelector('.car'); if (c2) c2.scrollLeft = sl; window.scrollTo(0, sy);
}

$app.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('a')) return;
  const th = t.closest('#btnTheme');
  if (th) {
    const dk = document.documentElement.classList.contains('dark'), nx = dk ? 'light' : 'dark';
    document.documentElement.className = nx; try { localStorage.setItem('busola_theme', nx); } catch (er) { /* tylko w pamięci */ }
    const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = nx === 'light' ? '#f5f2ea' : '#0d0e11';
    return render();
  }
  if (t.closest('#btnJr')) { S.view = 'journal'; window.scrollTo(0, 0); render(); return jrSettle(); }
  if (t.closest('#btnMap')) {
    S.view = 'map'; window.scrollTo(0, 0); mapStart(); const ld = mapLoadOi(), has = Object.keys(S.D).length > 0;
    S.mapF = has ? 0 : 1; render(); if (has) mapAnimate(1600); return ld;
  }
  if (t.closest('#mpPlay')) {
    if (S.mapPlay) { cancelAnimationFrame(mapRaf); S.mapPlay = false; S.mapCache = null; return mapFrame(); }
    return S.mapF >= 1 ? mapAnimate(9000, 0) : mapAnimate(9000 * (1 - S.mapF), S.mapF);
  }
  if (t.closest('#mpTrim')) { S.mapTrim = !S.mapTrim; return render(); }
  if (t.closest('#btnMapRef')) { mapPrices(); return mapLoadOi(true); }
  if (t.closest('#btnBack')) { mapStop(); S.view = 'home'; render(); return window.scrollTo(0, 0); }
  if (t.closest('#btnCsv')) return jrDownload();
  const jh = t.closest('[data-jh]'); if (jh) { S.jrH = jh.dataset.jh; return render(); }
  if (t.closest('#btnScan')) return scan();
  if (t.closest('#btnDemo')) { S.demo = true; S.err = ''; return scan(); }
  if (t.closest('#btnLive')) { S.demo = false; S.D = {}; return scan(); }
  const f = t.closest('[data-f]');
  if (f) { S.filter = f.dataset.f; try { localStorage.setItem('busola_filter', S.filter); } catch (er) { /* tylko w pamięci */ } return render(); }
  const s = t.closest('[data-sym]');
  if (s) {
    const sym = s.dataset.sym; S.open = S.open === sym ? null : sym; render();
    const d = S.D[sym]; if (S.open && d && !d.c15 && !d.pending && !d.stageErr) lazy15(d);
  }
});
$app.addEventListener('input', e => {
  if (e.target.id !== 'mpRange') return;
  cancelAnimationFrame(mapRaf); S.mapPlay = false; S.mapCache = null; S.mapF = (+e.target.value) / 1000; mapFrame();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (S.view === 'map') mapPrices(); if (S.ts && Date.now() - S.ts > 5 * 60e3) scan(); });

// ---------- ikona i manifest (dodanie do ekranu głównego) ----------
function drawIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  g.fillStyle = '#0d0e11'; g.fillRect(0, 0, size, size);
  g.fillStyle = '#d4af5a'; g.beginPath(); g.arc(size / 2, size / 2, size * 0.34, 0, Math.PI * 2); g.fill();
  g.save(); g.translate(size / 2, size / 2); g.rotate(40 * Math.PI / 180);
  const u = size / 100; g.fillStyle = '#1a1405';
  g.beginPath(); g.moveTo(0, -26 * u); g.lineTo(8 * u, 0); g.lineTo(-8 * u, 0); g.closePath(); g.fill();
  g.globalAlpha = 0.45; g.beginPath(); g.moveTo(0, 26 * u); g.lineTo(8 * u, 0); g.lineTo(-8 * u, 0); g.closePath(); g.fill();
  g.globalAlpha = 1; g.restore(); g.fillStyle = '#d4af5a'; g.beginPath(); g.arc(size / 2, size / 2, size * 0.035, 0, Math.PI * 2); g.fill();
  return c.toDataURL('image/png');
}
try {
  const a = document.createElement('link'); a.rel = 'apple-touch-icon'; a.href = drawIcon(180); document.head.appendChild(a);
  const mf = { name: 'Busola', short_name: 'Busola', start_url: location.href.split('#')[0], display: 'standalone', background_color: '#0d0e11', theme_color: '#0d0e11', icons: [{ src: drawIcon(512), sizes: '512x512', type: 'image/png', purpose: 'any' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' })); document.head.appendChild(l);
} catch (e) { /* bez ikony na ekranie głównym */ }

if (/[?&]demo\b/.test(location.search)) S.demo = true;
render(); scan();
window.__busola = { S, scan, render, classify, rankTop };
})();
</script>
