    var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#f2f5f4' : '#020202';
  } catch (e) { /* zostaje ciemny */ }
})();

<style>
:root { color-scheme: dark; }
/* Motyw D: mięta, czerń, biel i szarość; matowe szkło. Nazwa --gold została z wcześniejszej wersji i oznacza kolor akcentu w tekście. */
.dark {
  --bg: #020202; --surface: #0e1110; --surface2: rgba(255,255,255,.08); --line: rgba(255,255,255,.11);
  --fg: #f2f5f4; --muted: #a3a8a6;
  --acc: #00f6ac; --acc-ink: #020202; --grey: #c7cac8;
  --gold: #00f6ac; --gold-ink: #020202; --gold-soft: rgba(0,246,172,.13); --gold-line: rgba(0,246,172,.45);
  --up: #00f6ac; --up-soft: rgba(0,246,172,.14); --down: #ff7a7a; --down-soft: rgba(255,122,122,.15);
  --warn: #f2b766; --warn-soft: rgba(242,183,102,.15);
  --fl-up: #e8fff4; --fl-dn: #ffe3e7;
  --glass: rgba(255,255,255,.08); --glass-line: rgba(255,255,255,.15); --glass-sh: inset 0 1px 0 rgba(255,255,255,.20);
  --nav-bg: #f2f5f4; --nav-ic: #6a6f6d; --nav-on-bg: #020202; --nav-on-fg: #00f6ac;
  --cta-bg: #ffffff; --cta-fg: #020202;
  --t2-bg: #ffffff; --t2-fg: #020202; --t2-muted: #4a4f4d; --t2-up: #00704e; --t2-dn: #b3261e; --t2-s2: rgba(2,2,2,.07);
  --bar-line: rgba(255,255,255,.7); --bar-fill: linear-gradient(180deg, #e4e6e5, #b9bdbb);
  --blob1: rgba(0,246,172,.36); --blob2: rgba(190,200,196,.20); --blob3: rgba(0,246,172,.22);
  --bg-grad: linear-gradient(180deg, #121514 0%, #020202 38%);
  color-scheme: dark;
}
.light {
  --bg: #f2f5f4; --surface: #ffffff; --surface2: rgba(2,2,2,.06); --line: rgba(2,2,2,.10);
  --fg: #020202; --muted: #5a5f5d;
  --acc: #00f6ac; --acc-ink: #020202; --grey: #c7cac8;
  --gold: #00704e; --gold-ink: #ffffff; --gold-soft: rgba(0,112,78,.10); --gold-line: rgba(0,112,78,.40);
  --up: #00704e; --up-soft: rgba(0,112,78,.12); --down: #c43d32; --down-soft: rgba(196,61,50,.11);
  --warn: #8a4b00; --warn-soft: rgba(138,75,0,.12);
  --fl-up: #ffffff; --fl-dn: #ffffff;
  --glass: rgba(255,255,255,.62); --glass-line: rgba(255,255,255,.95); --glass-sh: inset 0 1px 0 #fff, 0 14px 34px -16px rgba(0,90,65,.35);
  --nav-bg: #020202; --nav-ic: #9aa09e; --nav-on-bg: #ffffff; --nav-on-fg: #020202;
  --cta-bg: #020202; --cta-fg: #ffffff;
  --t2-bg: #020202; --t2-fg: #ffffff; --t2-muted: #c8ccca; --t2-up: #00f6ac; --t2-dn: #ff7a7a; --t2-s2: rgba(255,255,255,.12);
  --bar-line: rgba(2,2,2,.7); --bar-fill: linear-gradient(180deg, #4a4f4d, #1c1f1e);
  --blob1: rgba(0,246,172,.34); --blob2: rgba(120,150,140,.22); --blob3: rgba(0,246,172,.22);
  --bg-grad: linear-gradient(180deg, #ffffff 0%, #f2f5f4 40%, #e6ebe9 100%);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
[hidden] { display: none !important; }
.up { color: var(--up); }
.down { color: var(--down); }

.app { max-width: 520px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
.hdr { padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px 0; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1; letter-spacing: -.01em; }
.logo { flex: none; color: var(--gold); }
.hbtns { display: flex; gap: 8px; }
.ibtn { width: 44px; height: 44px; padding: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: center; justify-content: center; }
.ibtn:active { background: var(--surface2); }
.spin svg { animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.meta { padding: 12px 20px 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); min-height: 30px; }
.dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--up); }
.dot.busy { background: var(--gold); }
.dot.err { background: var(--down); }
.bar { height: 2px; margin: 8px 20px 0; border-radius: 2px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .25s; }

.seg { margin: 16px 20px 0; padding: 4px; display: flex; gap: 4px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.segb { flex: 1; height: 40px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 13.5px; font-weight: 600; }
.segb.on { background: var(--gold-soft); color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold-line); }

.sect { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 26px 20px 12px; }
.sect h2 { margin: 0; font-size: 12.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.sect span { font-size: 12px; color: var(--muted); text-align: right; }

.car { display: flex; gap: 12px; padding: 0 20px 2px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.car::-webkit-scrollbar { display: none; }
.tcard { flex: 0 0 min(292px, 80vw); scroll-snap-align: start; padding: 16px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--gold-line); text-align: left; display: block; }
.light .tcard, .light .list, .light .dcard { box-shadow: 0 1px 3px rgba(40,30,10,.07), inset 0 1px 0 var(--gold-line); }
.tcard.sel { box-shadow: inset 0 0 0 1px var(--gold); }
.tc-head { display: flex; align-items: center; gap: 12px; }
.tc-name { flex: 1; min-width: 0; }
.mono { position: relative; width: 40px; height: 40px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--surface2); border: 1px solid var(--line); color: var(--gold); font-size: 15px; font-weight: 600; overflow: hidden; }
.mono img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: contain; }
.mono.has span { visibility: hidden; }
.sym { font-size: 17px; font-weight: 650; letter-spacing: .01em; }
.sym small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.dir { margin-top: 2px; font-size: 12px; font-weight: 600; }
.tc-price { display: flex; align-items: baseline; justify-content: space-between; margin-top: 16px; }
.big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
.chg { font-size: 14px; font-weight: 600; }
.spark { display: block; }
.spark polyline, .chart polyline { vector-effect: non-scaling-stroke; }
.tc-spark { margin-top: 10px; width: 100%; height: 48px; }
.tfs { display: flex; gap: 6px; margin-top: 14px; }
.tf { flex: 1; height: 30px; border-radius: 10px; background: var(--surface2); display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tf b { font-size: 10px; }
.tf.up b { color: var(--up); }
.tf.down b { color: var(--down); }
.oi { display: flex; gap: 8px; margin-top: 8px; }
.oic { flex: 1; display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 10px; background: var(--surface2); font-size: 12px; color: var(--muted); }
.oic b { font-weight: 650; }

.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.pill.s { height: 20px; padding: 0 8px; font-size: 10px; }
.p-trig { background: var(--gold); color: var(--gold-ink); }
.p-wait { color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold-line); }
.p-no { background: var(--surface2); color: var(--muted); }

.list { margin: 0 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.item { border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border: 0; background: transparent; text-align: left; }
.rname { flex: 1; min-width: 0; }
.rsym { font-size: 15px; font-weight: 650; }
.rsub { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11.5px; font-weight: 600; }
.rspark { width: 56px; height: 24px; flex: none; }
.rprice { width: 80px; text-align: right; flex: none; }
.item.open .row { background: var(--surface2); }
.rsub { flex-wrap: wrap; }
@media (max-width: 370px) { .rspark { display: none; } }
.rp { font-size: 15px; font-weight: 600; }
.rc { margin-top: 2px; font-size: 12.5px; font-weight: 600; }
.chev { flex: none; color: var(--muted); display: flex; }
.item.open .chev svg { transform: rotate(180deg); }

.panel { padding: 2px 14px 18px; }
.dcard { margin: 12px 20px 0; padding: 4px 14px 18px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--gold-line); }
.lab { margin: 16px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.cell { padding: 9px 0; border-radius: 12px; background: var(--surface2); text-align: center; }
.cell small { display: block; margin-bottom: 2px; font-size: 11px; color: var(--muted); }
.cell b { font-size: 12.5px; }
.chartw { position: relative; }
.chart { display: block; width: 100%; height: 110px; }
.mk { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid var(--surface); }
.mk.hi { background: var(--up); }
.mk.lo { background: var(--down); }
.mk.now { background: currentColor; }
.pl { stroke: var(--fg); stroke-opacity: .5; stroke-width: 1; stroke-dasharray: 3 4; vector-effect: non-scaling-stroke; }
.plab { position: absolute; right: 0; transform: translateY(-120%); padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; line-height: 15px; background: var(--surface2); color: var(--fg); pointer-events: none; }
@keyframes chReveal { from { clip-path: inset(-6px 100% -6px 0); } to { clip-path: inset(-6px -6px -6px 0); } }
@keyframes chFade { from { opacity: 0; } to { opacity: 1; } }
.chartw.anim .chart { animation: chReveal 2.5s cubic-bezier(.35,.6,.25,1) calc(0ms - var(--el, 0ms)) both; }
.chartw.anim .plab, .chartw.anim .mk { animation: chFade .5s ease-out calc(2400ms - var(--el, 0ms)) both; }
@media (prefers-reduced-motion: reduce) { .chartw.anim .chart, .chartw.anim .plab, .chartw.anim .mk { animation: none; } }
.cl { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.cond { display: flex; align-items: flex-start; gap: 10px; padding: 7px 0; font-size: 13px; line-height: 1.4; }
.ck { flex: none; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.ck.ok { background: var(--up-soft); color: var(--up); }
.ck.no { background: var(--down-soft); color: var(--down); }
.ck.na { background: var(--surface2); color: var(--muted); }
.cta { display: flex; align-items: center; justify-content: center; width: 100%; height: 46px; margin-top: 14px; border-radius: 14px; background: var(--gold); color: var(--gold-ink); font-size: 14px; font-weight: 650; text-decoration: none; }
.loading { padding: 18px 0 6px; font-size: 13px; color: var(--muted); }

.empty { margin: 0 20px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px dashed var(--line); font-size: 13px; line-height: 1.5; color: var(--muted); }
.banner { margin: 14px 20px 0; padding: 12px 14px; border-radius: 14px; background: var(--down-soft); color: var(--fg); font-size: 13px; line-height: 1.45; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.banner.demo { background: var(--gold-soft); }
.banner button { flex: none; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--gold-line); background: transparent; color: var(--gold); font-size: 12.5px; font-weight: 600; }
.fine { margin: 18px 20px 0; font-size: 11.5px; line-height: 1.55; color: var(--muted); }

.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 10px; font-weight: 700; letter-spacing: .05em; white-space: nowrap; }
.chip.ok { background: var(--up-soft); color: var(--up); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.dir .chip { margin-left: 6px; vertical-align: 1px; }
.zones { border-radius: 14px; background: var(--surface2); overflow: hidden; }
.zside { padding: 8px 12px 2px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.zone { display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; }
.zempty { font-size: 12.5px; color: var(--muted); }
.zdot { width: 8px; height: 8px; flex: none; margin-top: 5px; border-radius: 2px; }
.zdot.sup { background: var(--down); }
.zdot.dem { background: var(--up); }
.zmain { flex: 1; min-width: 0; }
.ztype { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; }
.ztype small { font-size: 11.5px; font-weight: 500; color: var(--muted); }
.zrange { margin-top: 2px; font-size: 12.5px; color: var(--muted); }
.zdist { flex: none; font-size: 13px; font-weight: 650; }
.tested { padding: 1px 6px; border-radius: 5px; background: var(--gold-soft); color: var(--gold); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.znow { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; padding: 7px 12px; background: var(--bg); border-block: 1px solid var(--line); font-size: 12.5px; font-weight: 600; }
.znow span:first-child { color: var(--gold); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
.mood { margin: 12px 20px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mtile { min-width: 0; padding: 10px 12px 9px; border-radius: 16px; background: var(--surface); border: 1px solid var(--gold-line); display: flex; flex-direction: column; }
.mlab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mval { display: flex; align-items: center; gap: 7px; margin-top: 6px; color: var(--gold); }
.mico { display: flex; }
.mico svg { width: 24px; height: 24px; }
.mnum { font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--fg); }
.mbars { display: flex; gap: 3px; margin-top: 8px; }
.mb { flex: 1; height: 4px; border-radius: 2px; background: var(--gold); opacity: .2; }
.mb.on { opacity: 1; }
.msub { margin-top: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fgsub { margin-top: 2px; text-align: center; }
.gauge { width: 100%; max-width: 104px; margin: 2px auto 0; display: block; overflow: visible; }

<script>

// ===================== LOGIC-START =====================
// Czysta logika (bez przeglądarki): kierunek trendu, zmiany cen, status coina, ranking Top 3, formatowanie liczb.
const N_PIV = 3;            // pivot N, jak w terminalu

function zonesOf(c1h, c4h, price, now) {

// Reakcja na OB (tylko coiny ze zgodnym kierunkiem): strefa 4H -> potwierdzenie na 1H, strefa 1H -> potwierdzenie na 15M.
